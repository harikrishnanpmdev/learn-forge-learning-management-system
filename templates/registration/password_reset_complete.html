{% extends 'base.html' %}
{% block content %}

<style>
    :root{
        --complete-primary:#6366f1;
        --complete-secondary:#8b5cf6;
        --complete-text:#0f172a;
        --complete-muted:#64748b;
        --complete-border:#e2e8f0;
    }

    body{
        margin:0;
        font-family:'Inter',sans-serif;
        background:
            radial-gradient(circle at top right, rgba(99,102,241,.18), transparent 25%),
            radial-gradient(circle at bottom left, rgba(139,92,246,.18), transparent 25%),
            #f8fafc;
    }

    .complete-wrapper{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:2rem 1rem;
    }

    .complete-card{
        position:relative;
        width:100%;
        max-width:460px;
        padding:2.7rem;
        border-radius:32px;
        background:rgba(255,255,255,.85);
        backdrop-filter:blur(18px);
        overflow:hidden;
        box-shadow:
            0 20px 50px rgba(15,23,42,.08),
            0 5px 18px rgba(15,23,42,.05);
        animation:floatCard 5s ease-in-out infinite;
        text-align:center;
    }

    @keyframes floatCard{
        0%,100%{
            transform:translateY(0px);
        }
        50%{
            transform:translateY(-8px);
        }
    }

    .complete-icon{
        width:80px;
        height:80px;
        margin:0 auto 1.4rem;
        border-radius:28px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:2rem;
        color:#fff;
        background:linear-gradient(135deg,var(--complete-primary),var(--complete-secondary));
    }

    .complete-title{
        font-size:2rem;
        font-weight:700;
        color:var(--complete-text);
        margin-bottom:.7rem;
    }

    .complete-subtitle{
        text-align:center;
        color:var(--complete-muted);
        font-size:.96rem;
        line-height:1.8;
        margin-bottom:2.2rem;
    }

    .login-btn{
        width:100%;
        height:58px;
        border:none;
        border-radius:18px;
        background:linear-gradient(135deg,var(--complete-primary),var(--complete-secondary));
        color:#fff;
        font-size:1rem;
        font-weight:700;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:.5rem;
        text-decoration:none;
        transition:all .3s ease;
        box-shadow:0 15px 25px rgba(99,102,241,.22);
    }

    .login-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 20px 35px rgba(99,102,241,.28);
        color:#fff;
    }

    .success-note{
        margin-top:1.4rem;
        font-size:.88rem;
        color:var(--complete-muted);
    }

    @media(max-width:576px){

        .complete-card{
            padding:2rem 1.3rem;
            border-radius:26px;
        }

        .complete-title{
            font-size:1.7rem;
        }

        .complete-subtitle{
            font-size:.92rem;
        }
    }
</style>

<div class="complete-wrapper">
    <div class="complete-card">
        <div class="complete-icon">
            <i class="bi bi-check-circle-fill"></i>
        </div>

        <h2 class="complete-title">
            Password Reset Successful
        </h2>

        <p class="complete-subtitle">
            Your password has been successfully changed.
            You can now sign in using your new password.
        </p>

        <a href="{% url 'accounts:login' %}" class="login-btn">
            <i class="bi bi-box-arrow-in-right"></i>
            Sign In Now
        </a>

        <div class="success-note">
            Your account is now secure with the new password.
        </div>
    </div>
</div>
{% endblock %}
