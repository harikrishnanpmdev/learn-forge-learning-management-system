{% extends 'base.html' %}
{% block content %}

<style>
    :root{
        --reset-primary:#6366f1;
        --reset-secondary:#8b5cf6;
        --reset-text:#0f172a;
        --reset-muted:#64748b;
        --reset-border:#e2e8f0;
    }

    body{
        margin:0;
        font-family:'Inter',sans-serif;
        background:
            radial-gradient(circle at top right, rgba(99,102,241,.18), transparent 25%),
            radial-gradient(circle at bottom left, rgba(139,92,246,.18), transparent 25%),
            #f8fafc;
    }

    .reset-wrapper{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:2rem 1rem;
    }

    .reset-card{
        position:relative;
        width:100%;
        max-width:460px;
        padding:2.7rem;
        border-radius:32px;
        background:rgba(255,255,255,.85);
        backdrop-filter:blur(18px);
        overflow:hidden;
        box-shadow:
            0 20px 50px rgba(15,23,42,.08),
            0 5px 18px rgba(15,23,42,.05);
        animation:floatCard 5s ease-in-out infinite;
    }

    @keyframes floatCard{
        0%,100%{
            transform:translateY(0px);
        }
        50%{
            transform:translateY(-8px);
        }
    }

    .reset-icon{
        width:80px;
        height:80px;
        margin:0 auto 1.4rem;
        border-radius:28px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:2rem;
        color:#fff;
        background:linear-gradient(135deg,var(--reset-primary),var(--reset-secondary));
    }

    .reset-title{
        font-size:2rem;
        font-weight:700;
        text-align:center;
        color:var(--reset-text);
        margin-bottom:.7rem;
    }

    .reset-subtitle{
        text-align:center;
        color:var(--reset-muted);
        font-size:.96rem;
        line-height:1.8;
        margin-bottom:2.2rem;
    }

    .form-label{
        font-weight:550;
        color:var(--reset-text);
        margin-bottom:.7rem;
    }

    .reset-input{
        width:100%;
        height:64px;
        border-radius:18px;
        border:1.5px solid var(--reset-border);
        text-align:center;
        font-size:1.4rem;
        font-family:'JetBrains Mono', monospace;
        color:var(--reset-text);
        background:#fff;
        transition:all .25s ease;
        outline:none;
        margin-bottom:1.2rem;
    }

    .reset-input:focus{
        border-color:var(--reset-primary);
        box-shadow:0 0 0 5px rgba(99,102,241,.12);
        transform:translateY(-2px);
    }

    .reset-btn{
        width:100%;
        height:58px;
        border:none;
        border-radius:18px;
        background:linear-gradient(135deg,var(--reset-primary),var(--reset-secondary));
        color:#fff;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        transition:all .3s ease;
        box-shadow:0 15px 25px rgba(99,102,241,.22);
    }

    .reset-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 20px 35px rgba(99,102,241,.28);
    }

    .back-link{
        margin-top:1.4rem;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:.4rem;
        color:var(--reset-muted);
        text-decoration:none;
        font-size:.92rem;
        transition:.2s ease;
    }

    .back-link:hover{
        color:var(--reset-primary);
    }

    .alert-danger{
        border-radius:10px;
        font-size:.92rem;
        font-style:italic;
    }
    
    @media(max-width:576px){

        .reset-card{
            padding:2rem 1.3rem;
            border-radius:26px;
        }

        .reset-title{
            font-size:1.7rem;
        }

        .reset-input{
            height:58px;
            font-size:1.2rem;
        }
    }
</style>

<div class="reset-wrapper">
    <div class="reset-card">
        <div class="reset-icon">
            <i class="bi bi-key-fill"></i>
        </div>

        <h2 class="reset-title">
            Reset Password
        </h2>

        <p class="reset-subtitle">
            Enter your email address below and we'll send you a link to reset your password.
        </p>

        {% if form.errors %}
        <div class="alert alert-danger text-center mb-4">
            Please Enter a Valid Email Address.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label class="form-label">Email Address</label>

            <input type="email" name="email" class="reset-input" autofocus>
            <input type="submit" value="Send Reset Link" class="reset-btn">
        </form>

        <a href="{% url 'accounts:login' %}" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Back to Sign In
        </a>
    </div>
</div>
{% endblock %}
